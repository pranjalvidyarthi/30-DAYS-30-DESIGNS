<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analog Clock || Pranjal Vidyarthi || The Creative coder</title>
</head>
<style>
    /* Analog Clock style  */
    body{
        background: #2f363e;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        min-height: 100vh;
    }
    .container{
        position: relative;
        background: #2f363e;
        border-radius: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
    }

    .clock{
        position: relative;
        width: 450px;
        height: 450px;
        background: #2f363e;
        border-radius: 50%;
        box-shadow: 10px 50px 70px rgba(0,0,0,0.25),
        inset 5px 5px 10px rgba(0,0,0,0.5),
        inset 5px 5px 20px rgba(0,0,0,0.2),
        inset -5px -5px 15px rgba(0,0,0,0.75);
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .clock::before{
        content: '';
        position: absolute;
        width: 8px;
        height: 8px;
        background: #2f363e;
        border: 3px solid #fff;
        border-radius: 50%;
        z-index: 100000;
    }

    .clock span{
        position: absolute;
        inset: 20px;
        color: #fff;
        text-align: center;
        transform: rotate(calc(30deg * var(--i)));
    }

    .clock span b{
        font-size: 2.2em;
        opacity: 0.25;
        font-weight: 700;
        display: inline-block;
        transform: rotate(calc(-30deg * var(--i)));
    }

    .circle{
        position: absolute;
        width: 300px;
        height: 300px;
        border: 2px solid rgba(0,0,0,0.25);
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        z-index: 10;
    }

    .circle i{
        position: absolute;
        width: 6px;
        height: 50%;
        background-color: var(--clr);
        opacity: 0.75;
        transform-origin: bottom;
        transform: scaleY(0.5);
    }

    .circle:nth-child(1) i{
        width: 2px;  
        } 

    .circle:nth-child(2) i{
        width: 6px;

    }

    .circle2{
        width: 240px;
        height: 240px;
        z-index: 9;
    }

    .circle3{
        height: 180px;
        width: 180px;
        z-index: 8;
    }

    .circle::before{
        content: '';
        position: absolute;
        top: -8.5px;
        width: 15px;
        height: 15px;
        border-radius: 50%;
        background-color: var(--clr);
        box-shadow: 0 0 10px var(--clr),
        0 0 40px var(--clr);
    }

</style>
<body>
    <div class="container">
        <!-- analog Clock  -->
        <div class="clock">
            <div class="circle" id="sc" style="--clr:#04fc43"><i></i></div>
            <div class="circle circle2" id="mn" style="--clr:#fee800"><i></i></div>
            <div class="circle circle3" id="hr" style="--clr:#ff2972"><i></i></div>

            <span style="--i:1"><b>1</b></span>
            <span style="--i:2"><b>2</b></span>

            <span style="--i:3"><b>3</b></span>
            <span style="--i:4"><b>4</b></span>
            <span style="--i:5"><b>5</b></span>
            <span style="--i:6"><b>6</b></span>
            <span style="--i:7"><b>7</b></span>
            <span style="--i:8"><b>8</b></span>
            <span style="--i:8"><b>8</b></span>
            <span style="--i:9"><b>9</b></span>
            <span style="--i:10"><b>10</b></span>
            <span style="--i:11"><b>11</b></span>
            <span style="--i:12"><b>12</b></span>

        </div>
    </div>
</body>
<script>
    // Working Clock
    let hr =  document.querySelector('#hr');
    let mn = document.querySelector('#mn') ;
    let sc = document.querySelector('#sc') ;

    setInterval(() => {
      let day = new Date();
      let hh = day.getHours() * 30;
      let mm = day.getMinutes() * 6;
      let ss = day.getSeconds() * 6;
            
      hr.style.transform = `rotateZ(${hh+(mm/12)}deg)`;
      mn.style.transform = `rotateZ(${mm}deg)`;
      sc.style.transform = `rotateZ(${ss}deg)`;

    });
</script>
</html>
