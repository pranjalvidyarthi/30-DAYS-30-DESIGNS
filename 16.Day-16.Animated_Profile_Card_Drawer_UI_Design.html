<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
</head>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body{
    display: flex;
    justify-content: center;
    align-items: center;
    background: #000000dd;
    min-height: 100vh;
}

.card{
    position: relative;
    width: 350px;
    height: 85px;
    background-color: royalblue;
    border-radius: 20px;
    transition: 0.5s ease-in-out;
    filter: drop-shadow(-20px 20px 40px #398cc055);
}

.card.active{
    height: 420px;
}
.toggle{
    position: absolute;
    bottom: -60px;
    left: 50%;
    transform: translateX(-50%);
    width: 70px;
    height: 60px;
    background-color: royalblue;
    border-bottom-left-radius: 35px;
    border-bottom-right-radius: 35px;
    cursor: pointer;
}

.toggle::before{
    content: '';
    left: -34px;
    position: absolute;
    width: 35px;
    height: 35px;
    background-color: transparent;

    border-top-right-radius: 35px;
    box-shadow: 11px -10px 0 10px royalblue;
}

.toggle::after{
    content: '';
    right: -34px;
    position: absolute;
    width: 35px;
    height: 35px;
    background-color: transparent;
    border-top-left-radius: 35px;
    box-shadow: -11px -10px 0 10px royalblue;
}

.toggle span{
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, 70%) rotate(405deg);
    width: 10px;
    height: 10px;
    border-bottom: 3px solid #fff;
    border-right: 3px solid #fff;
}

.card.active .toggle span{
    transform: translate(-50%, 70%) rotate(225deg);
}

.contentBx{
    position: absolute;
    inset: 0;
    overflow: hidden;
}

.contentBx .content{
    position: relative;
    padding: 20px;
    text-align: center;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 10;
    flex-direction: column;
}

.contentBx .content h2{
    color: #fff;
    font-weight: 500;
    font-size: 1.25em;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    line-height: 1.1em;
}

.contentBx .content h2 span{
    font-size: 0.75em;
    font-weight: 400;
    text-transform: initial;
}

.imgBx{
    position: relative;
    width: 250px;
    height: 250px;
    background: #fff;
    margin-top: 20px;
    box-shadow: -10px 10px 10px rgba(0,0,0,0.15);
    border: 5px solid #fff;
}

.imgBx img{
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.content button{
    position: relative;
    margin-top: 20px;
    padding: 10px 35px;
    border-radius: 25px;
    border: none;
    outline: none;
    cursor: pointer;
    font-size: 1em;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 500;
    color: #333;

}
</style>
<body>
    <div class="card">
        <div class="contentBx">
            <div class="content">
                <h2>The Creative Coder<br><span>Creative Designer</span></h2>
                <div class="imgBx">
                    <img src="https://pranjalvidyarthi.github.io/assets/pranjalvidyarthi-B6_IITSx.jpg" alt="">
                </div>
                <button>Subscribe Now</button>
            </div>
        </div>
        <div class="toggle"><span></span></div>
    </div>
</body>
<script>
    let card = document.querySelector('.card');
    let cardtoggle = document.querySelector('.toggle');
    cardtoggle.onclick = function() {
        card.classList.toggle('active');
    }
</script>
</html>
