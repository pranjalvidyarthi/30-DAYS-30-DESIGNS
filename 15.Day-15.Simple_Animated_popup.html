<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Animated Popup Design</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body{
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: #000;
    }

    .container{
        position: relative;
        width: 0px;
        height: 0px;
        background-color: #37444b;
        border-radius: 25px;
        transition: 0.5s;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .container.active{
        width: 400px;
        height: 400px;
    }

    .container::before{
        content: '';
        position: absolute;
        bottom: -15px;
        height: 40px;
        transition: 0.5s;
        width: 40px;
        background-color: #37444b;
        border-radius: 5px;
        transform: rotate(45deg);
    }

    .toggleBtn{
        position: absolute;
        bottom: -29px;
        min-width: 60px;
        height: 60px;
        background-color: skyblue;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .toggleBtn::before{
        content: '+';
        font-size: 2.5em;
        color: #fff;
    }

    .container.active .toggleBtn{
        bottom: -90px;
        transform: rotate(135deg);
        background-color: #ff5a57;
    }

    .container .content{
        min-width: 400px;
        padding: 40px;
        color: #fff;
        opacity: 0;
        transition: 0.5s;
        transform: scale(0);
    }

    .container.active .content{
        opacity: 1;
        transition-delay: 0.5s;
        transform: scale(1);
    }

    .container.active::before{
        opacity: 1;
        transition-delay: 0.5s;
    }
</style>
<body>
    <div class="container">
        <div class="content">
            <h2>The Crative Coder</h2>
            <p>m still learning, always building, and sharing everything along the way. If you're into code, creativity, or just want to connect — let's talk!</p>
        </div>
        <div class="toggleBtn"></div>
    </div>
</body>
<script>
    let toggleBtn = document.querySelector('.toggleBtn');
    let container = document.querySelector('.container');

    toggleBtn.onclick = function()  {
        container.classList.toggle('active');
    }
</script>
</html>
