<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twirlling Text Animation</title>
</head>
<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        height: 100%;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #ff7979;
        ;
    }

    .container {
        max-height: 100vh;
        overflow-y: scroll;
        position: relative;
        scroll-snap-type: y mandatory;
        -webkit-overflow-scrolling: touch;
    }

    .headline {
        align-items: center;
        background-color: var(--color);
        display: flex;
        font-family: 'Lexend Deca', sans-serif;
        font-weight: 700;
        font-size: calc(1rem + 15vmin);
        height: 100vh;
        justify-content: center;
        overflow: hidden;
        perspective: 1000px;
        scroll-snap-align: start;
        width: 100vw;
    }


    .word,
    .char {
        animation-delay: var(--del);
        animation-direction: var(--dir, normal);
        animation-duration: var(--dur);
        animation-iteration-count: var(--it, infinite);
        animation-name: var(--name);
        animation-timing-function: var(--tf);
        animation-fill-mode: var(--fill, forwards);
        display: inline-block;
        position: relative;
        transform-origin: 50% 100%;
        z-index: 1;
    }

    .headline--twirl .char {
        --name: twirl;
        --dur: 6000ms;
        --del: calc(var(--char-index) * 0.025s);
        --tf: linear;
    }

    @keyframes twirl {
        2.5% {
            transform: rotateY(1turn);
        }

        5% {
            transform: rotateY(2turn);
        }

        10% {
            transform: rotateY(3turn);
        }

        20% {
            transform: rotateY(4turn);
        }

        40% {
            transform: rotateY(5turn);
        }

        70%,
        100% {
            transform: rotateY(6turn);
        }
    }

    .headline--twirl span{
        color: #ffffffce;
    }
</style>

<body>
    <h2 data-splitting class="headline headline--twirl">
        <span>t</span>
        <span> w</span>
        <span> i</span>
        <span>r</span> 
        <span> l</span>
        <span> i</span>
        <span> n</span>
        <span> g</span>
    </h2>
</body>
<script src="https://unpkg.com/splitting/dist/splitting.min.js">
</script>
<script>
    Splitting();
</script>

</html>
