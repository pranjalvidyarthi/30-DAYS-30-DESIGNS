<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glow Button</title>
</head>
<style>
    body {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #0f172a;
}

button {
  padding: 15px 40px;
  font-size: 18px;
  color: white;
  background: transparent;
  border: 2px solid #00f7ff;
  border-radius: 30px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: 0.3s;
}

button::before {
  content: "";
  position: absolute;
  width: 300%;
  height: 300%;
  background: radial-gradient(circle, #00f7ff, transparent);
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0);
  transition: 0.5s;
}

button:hover::before {
  transform: translate(-50%, -50%) scale(1);
}

button:hover {
  color: #ffffff;
  background: rgba(0, 247, 255, 0.15);
  backdrop-filter: blur(5px);
  box-shadow: 0 0 25px #00f7ff, 0 0 80px #00f7ff;
}

button {
  position: relative;
  z-index: 1;
}

button::before {
  z-index: -1;
}
</style>
<body>
    <button>Hover Me</button>
</body>
</html>
